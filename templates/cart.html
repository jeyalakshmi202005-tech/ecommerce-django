{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<h2>Shopping Cart</h2>

<table class="table">

<tr>

<th>Product</th>

<th>Price</th>

<th>Quantity</th>

<th>Total</th>

<th>Action</th>

</tr>

{% for item in items %}

<tr>

<td>{{item.product.name}}</td>

<td>₹{{item.product.price}}</td>

<td>

<a href="{% url 'decrease' item.id %}" class="btn btn-danger btn-sm">-</a>

{{item.quantity}}

<a href="{% url 'increase' item.id %}" class="btn btn-success btn-sm">+</a>

</td>

<td>

₹{{item.total_price}}

</td>

<td>

<a href="{% url 'remove' item.id %}" class="btn btn-warning">

Remove

</a>

</td>

</tr>

{% endfor %}

</table>

<h3>Total : ₹{{total}}</h3>

<a href="{% url 'checkout' %}" class="btn btn-primary">
    Checkout
</a>

</div>

{% endblock %}
