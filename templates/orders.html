{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<h2>My Orders</h2>

<table class="table">

<tr>
<th>Product</th>
<th>Quantity</th>
<th>Date</th>
</tr>

{% for order in orders %}

<tr>
<td>{{ order.product.name }}</td>
<td>{{ order.quantity }}</td>
<td>{{ order.ordered_at }}</td>
</tr>

{% endfor %}

</table>

</div>

{% endblock %}
